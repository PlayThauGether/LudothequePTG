<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeux de la soirée · Play Thau'Gether</title>
<meta name="theme-color" content="#5C3A21">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --beige:#EFE2D3; --beige-clair:#FAE5D8; --marron:#5C3A21; --terracotta:#C0522A;
  --teal:#2F6E62; --dore:#C9A57E; --carte:#FBF5EE; --ligne:#E2D0BC;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--beige);color:var(--marron);font-family:Poppins,system-ui,sans-serif;font-size:16px;line-height:1.55;min-height:100vh;padding-bottom:40px}
a{color:var(--teal)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{padding:22px 0 8px;position:relative}
.badge{position:absolute;top:22px;right:0;background:var(--terracotta);color:var(--beige-clair);font-weight:600;font-size:13px;letter-spacing:1px;padding:5px 10px;border-radius:6px}
h1,h2,h3{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;letter-spacing:.5px;color:var(--terracotta);line-height:1.05}
h1{font-size:44px;padding-right:70px}
.trait{width:32px;height:3px;background:var(--teal);margin:10px 0 12px;border-radius:2px}
.sous{font-size:15px}
.sous b{color:var(--teal)}
/* Filtres */
.filtres{margin:18px 0 6px}
.recherche{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--ligne);border-radius:10px;background:var(--carte);color:var(--marron);outline:none}
.recherche:focus{border-color:var(--teal)}
.label{font-weight:600;font-size:14px;margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;border:2px solid var(--ligne);background:var(--carte);color:var(--marron);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip.actif{background:var(--teal);border-color:var(--teal);color:#fff}
.compte{font-size:13px;margin:14px 0 8px;opacity:.8}
/* Liste */
.liste{display:grid;gap:10px}
.jeu{display:block;text-decoration:none;color:inherit;background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:14px 16px;position:relative}
.jeu:active{transform:scale(.99)}
.jeu{display:flex!important;gap:12px;align-items:flex-start}
.jeu .txt{flex:1;min-width:0}
.jeu h2{font-size:26px;padding-right:24px}
.vignette{width:72px;height:72px;flex:none;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--ligne)}
.couverture{display:block;width:100%;max-height:230px;object-fit:contain;background:#fff;border-radius:12px;border:1px solid var(--ligne);margin:6px 0 14px}
.sans{display:flex;align-items:center;justify-content:center;font-family:"Bebas Neue",Impact,sans-serif;font-size:34px;color:var(--beige-clair);background:var(--terracotta)}
.couverture.sans{height:110px;font-size:60px}
.jeu .meta{font-size:13px;display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:2px}
.jeu .meta span b{color:var(--teal)}
.jeu p{font-size:14px;margin-top:6px}
.jeu:after{content:"›";position:absolute;right:16px;top:12px;font-size:28px;color:var(--teal)}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--teal);border:1px solid var(--teal);border-radius:6px;padding:0 6px}
.vide{padding:24px;text-align:center;background:var(--carte);border-radius:12px}
/* Fiche */
.retour{display:inline-block;margin:20px 0 4px;font:inherit;font-weight:600;background:none;border:none;color:var(--teal);cursor:pointer;padding:6px 0;text-decoration:none}
.fiche h1{font-size:46px;padding-right:0}
.fiche .meta{font-size:14px;display:flex;flex-wrap:wrap;gap:6px 16px}
.fiche .meta b{color:var(--teal)}
.onglets{display:flex;gap:6px;margin:18px 0 0;position:sticky;top:0;background:var(--beige);padding:8px 0;z-index:5}
.onglet{flex:1;font:inherit;font-size:14px;font-weight:600;padding:10px 6px;border:2px solid var(--ligne);border-radius:10px;background:var(--carte);color:var(--marron);cursor:pointer}
.onglet.actif{background:var(--marron);border-color:var(--marron);color:var(--beige-clair)}
.panneau{display:none;background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:18px 16px;margin-top:10px}
.panneau.actif{display:block}
.panneau h3{font-size:24px;margin:16px 0 6px}
.panneau h3:first-child{margin-top:0}
.panneau p{margin:6px 0}
.panneau ul,.panneau ol{padding-left:22px;margin:6px 0}
.panneau li{margin:4px 0}
.panneau b{color:var(--teal)}
.bref li{margin:8px 0}
.note{font-size:13px;opacity:.8;margin-top:14px;border-top:1px solid var(--ligne);padding-top:10px}
.video-box{position:relative;width:100%;aspect-ratio:16/9;background:var(--marron);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.video-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.btn{display:inline-block;font:inherit;font-weight:600;background:var(--terracotta);color:var(--beige-clair);border:none;border-radius:10px;padding:12px 18px;cursor:pointer;text-decoration:none;text-align:center}
.btn.second{background:none;color:var(--teal);border:2px solid var(--teal);padding:10px 16px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
td,th{border:1px solid var(--ligne);padding:6px 8px;text-align:left}
th{background:var(--beige)}
.diff{letter-spacing:1px;color:var(--terracotta);font-size:12px}
.diff i{font-style:normal;color:var(--ligne)}
.legende{font-size:13px;margin-top:12px}
.groupe{margin-top:22px}
.gtitre{font-size:30px}
.gdesc{font-size:13px;margin:0 0 10px;opacity:.85}
.debut{background:var(--beige-clair);border:2px dashed var(--terracotta);border-radius:14px;padding:14px 12px 12px}
.rliste{margin-top:6px}.rliste li{margin:6px 0}.rliste span{font-size:13px;opacity:.8}
.offi{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--ligne);font-size:14px}
footer{text-align:center;font-size:13px;margin-top:28px;opacity:.75}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =====================================================================

   video : identifiant YouTube (la partie après "v=" dans l'URL). Vide = lien de recherche.
   ===================================================================== */

{

  pitch:"Développez votre cité antique en 3 âges en choisissant une carte à la fois.",
  video:"0EI9OkSnVeM",
  bref:[
    "Chacun dirige une cité avec sa merveille. La partie dure 3 âges.",

<p>Avoir le plus de points de victoire à la fin du 3e âge, grâce aux bâtiments, à la merveille, à l'armée, à la science et à l'argent.</p>

<li>On révèle en même temps. Chaque joueur fait une des 3 actions avec sa carte :

<li><b>Construire une étape de merveille</b> : payer le coût de l'étape et glisser la carte face cachée sous le plateau.</li>

<li>On passe les cartes restantes au voisin : <b>à gauche</b> à l'âge I, <b>à droite</b> à l'âge II, <b>à gauche</b> à l'âge III.</li>

<p>Au 6e tour, il reste 2 cartes : on en joue une, la dernière est défaussée.</p>
<h3>Commerce</h3>
<p>Vous pouvez acheter une ressource produite par un <b>voisin direct</b> (gauche ou droite) pour <b>2 pièces</b> par ressource. Le voisin ne peut pas refuser. Certaines cartes jaunes réduisent ce prix.</p>

<p>À la fin de chaque âge, chacun compare ses boucliers avec ses deux voisins : victoire = jeton de <b>+1</b> (âge I), <b>+3</b> (âge II), <b>+5</b> (âge III) ; défaite = jeton <b>-1</b> ; égalité = rien.</p>

<p>Égalité : celui qui a le plus de pièces gagne.</p>`

<p>Surtout rigoler. Si vous voulez des points : retrouver le mot de départ à la fin de votre carnet.</p>

<p>La partie compte <b>autant de manches que de joueurs</b>. Le pion Catrina désigne le premier joueur et passe à gauche à chaque manche.</p>
<p>Le plateau présente les tuiles disponibles pour la manche, réparties sur deux lignes. Quand une ligne est vide, le choix se réduit : pensez-y en fin de manche.</p>

<p>Seul ce qui est <b>relié à votre tuile de départ</b> par une route pavée ou un sentier compte.</p>

</ul>
<h3>Fin de partie</h3>
<p>À la fin de la dernière manche, faites le décompte sur le carnet de score. Le plus haut total gagne.</p>`

{

const app = document.getElementById('app');
let filtreJoueurs = 0;
let filtreCat = '';
let recherche = '';
let scrollListe = 0;

const CATS = [
  {nom:"RAPIDE & FUN", desc:"Règles en deux minutes, parties courtes", coul:"#C0522A"},
  {nom:"AMBIANCE & RIRES", desc:"On parle, on dessine, on rigole", coul:"#9A6A2E"},
  {nom:"BLUFF & TRAHISON", desc:"Rôles cachés, on ment, on se méfie", coul:"#3A2313"},
  {nom:"RÉFLEXION", desc:"On se pose, on construit, on optimise", coul:"#2F6E62"},
  {nom:"DUEL", desc:"Pour ceux qui viennent à deux", coul:"#5C3A21"}
];
function coulCat(c){const x=CATS.find(k=>k.nom===c);return x?x.coul:'#2F6E62'}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function joueursTxt(j){return j.min===j.max ? j.min+' joueurs' : j.min+' à '+j.max+' joueurs'}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function diffTxt(d){return '<span class="diff" title="Difficulté">'+'●'.repeat(d)+'<i>'+'●'.repeat(3-d)+'</i></span>'}
function tagCat(c){return `<span class="tag" style="color:${coulCat(c)};border-color:${coulCat(c)}">${esc(c)}</span>`}

function photo(j,cls){
  if(!j.img) return `<div class="${cls} sans" aria-hidden="true">${esc(j.nom.charAt(0))}</div>`;
  return `<img class="${cls}" src="${esc(j.img)}-moyenne.jpg" alt="Boîte de ${esc(j.nom)}" loading="lazy" data-base="${esc(j.img)}" data-essai="0" onerror="imgSecours(this)">`;
}
function imgSecours(el){
  const tailles=['-petite.jpg','-grande.jpg'];
  const n=+el.dataset.essai;
  if(n<tailles.length){el.dataset.essai=n+1;el.src=el.dataset.base+tailles[n];}
  else{el.replaceWith(Object.assign(document.createElement('div'),{className:el.className+' sans',textContent:el.alt.replace('Boîte de ','').charAt(0)}));}
}

function carteJeu(j){return `
    <a class="jeu" href="#${j.id}" style="border-left:5px solid ${coulCat(j.cat)}">
      ${photo(j,'vignette')}
      <div class="txt">
      <h2>${esc(j.nom)}</h2>
      <div class="meta"><span><b>${joueursTxt(j)}</b></span><span>${esc(j.duree)}</span>${diffTxt(j.diff)}</div>
      <p>${esc(j.pitch)}</p>
      </div>
    </a>`}

function vueListe(){
  document.title = "Jeux de la soirée · Play Thau'Gether";
  const tailles = [2,3,4,5,6,7,8];
  app.innerHTML = `
  <header>
    <span class="badge">PTG</span>
    <h1>Les jeux de la soirée</h1>
    <div class="trait"></div>
    <p class="sous">Choisissez un jeu : règles en bref, règles détaillées, <b>vidéo</b> et règles officielles. Besoin d'aide ? Demandez à un organisateur.</p>
  </header>
  <div class="filtres">
    <input class="recherche" id="q" type="search" placeholder="Chercher un jeu…" value="${esc(recherche)}" autocomplete="off">
    <div class="label">On est combien ?</div>
    <div class="chips" id="chips">
      <button class="chip ${filtreJoueurs===0?'actif':''}" data-n="0">Tous</button>
      ${tailles.map(n=>`<button class="chip ${filtreJoueurs===n?'actif':''}" data-n="${n}">${n===8?'8+':n}</button>`).join('')}
    </div>
    <div class="label">Envie de quoi ?</div>
    <div class="chips" id="cats">
      <button class="chip ${filtreCat===''?'actif':''}" data-c="">Tout</button>
      ${CATS.map(c=>`<button class="chip ${filtreCat===c.nom?'actif':''}" data-c="${esc(c.nom)}">${esc(c.nom)}</button>`).join('')}
    </div>
    <p class="legende">Difficulté : ${diffTxt(1)} facile · ${diffTxt(2)} moyen · ${diffTxt(3)} costaud</p>
  </div>
  <div class="compte" id="compte"></div>
  <div id="liste"></div>
  <footer>Play Thau'Gether · En cas de doute, le livret de la boîte fait foi.</footer>`;
  const q = document.getElementById('q');
  q.addEventListener('input',()=>{recherche=q.value;remplirListe()});
  document.getElementById('chips').addEventListener('click',e=>{
    const b=e.target.closest('.chip'); if(!b) return;
    filtreJoueurs=+b.dataset.n;
    document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('actif',c===b));
    remplirListe();
  });
  document.getElementById('cats').addEventListener('click',e=>{
    const b=e.target.closest('.chip'); if(!b) return;
    filtreCat=b.dataset.c;
    document.querySelectorAll('#cats .chip').forEach(c=>c.classList.toggle('actif',c===b));
    remplirListe();
  });
  remplirListe();
  window.scrollTo(0,scrollListe);
}

function remplirListe(){
  const r = norm(recherche.trim());
  const res = JEUX.filter(j=>{
    if(r && !norm(j.nom+' '+j.cat).includes(r)) return false;
    if(filtreCat && j.cat!==filtreCat) return false;
    if(filtreJoueurs){
      if(filtreJoueurs===8) return j.max>=8;
      return j.min<=filtreJoueurs && j.max>=filtreJoueurs;
    }
    return true;
  });
  document.getElementById('compte').textContent = res.length+(res.length>1?' jeux':' jeu');
  if(!res.length){document.getElementById('liste').innerHTML=`<div class="vide">Aucun jeu ne correspond. Essayez un autre filtre.</div>`;return}
  let html='';
  const sansFiltre = !r && !filtreCat && !filtreJoueurs;
  if(sansFiltre){
    const deb = JEUX.filter(j=>j.debut);
    html += `<section class="groupe debut"><h2 class="gtitre">Pour commencer</h2><p class="gdesc">Vous ne savez pas quoi prendre ? Ces jeux s'expliquent en deux minutes et marchent avec tout le monde.</p><div class="liste">${deb.map(carteJeu).join('')}</div></section>`;
  }
  CATS.forEach(c=>{
    const g=res.filter(j=>j.cat===c.nom); if(!g.length) return;
    html += `<section class="groupe"><h2 class="gtitre" style="color:${c.coul}">${esc(c.nom)}</h2><p class="gdesc">${esc(c.desc)}</p><div class="liste">${g.map(carteJeu).join('')}</div></section>`;
  });
  document.getElementById('liste').innerHTML = html;
}

  if(!j.regles) return '<p class="offi">Pas de règle officielle en ligne pour ce jeu : le livret est dans la boîte.</p>';
  const lib = {"PDF":"Règles officielles (PDF)","PDF-en":"Règles officielles (PDF, en anglais)","site":"Règles sur le site de l'éditeur","faq":"FAQ officielle de l'éditeur","fr":"Règles complètes en français"}[j.reglesType]||"Règles officielles";
  return `<div class="offi"><a class="btn" href="${esc(j.regles)}" target="_blank" rel="noopener">${lib}</a></div>`;
}

      <div class="video-box" id="vbox"><button class="btn" id="play">Lancer la vidéo</button></div>
      <div class="actions"><a class="btn second" href="${esc(ytLien)}" target="_blank" rel="noopener">Ouvrir dans YouTube</a></div>
      <p class="note">La vidéo ne se charge pas ? Ouvrez-la dans YouTube. Pensez au son : un écouteur, c'est plus confortable dans le bruit.</p>`
      : `<p>Pas de vidéo unique pour ce jeu : les règles changent selon le jeu de cartes choisi.</p>
      <div class="actions"><a class="btn" href="${esc(ytLien)}" target="_blank" rel="noopener">Chercher une vidéo sur YouTube</a></div>`}
    </div>
  </div>
  <footer><a href="#">Retour à la liste des jeux</a></footer>`;
  document.querySelector('.onglets').addEventListener('click',e=>{
    const b=e.target.closest('.onglet'); if(!b) return;
    document.querySelectorAll('.onglet').forEach(o=>{o.classList.toggle('actif',o===b);o.setAttribute('aria-selected',o===b);});
    document.querySelectorAll('.panneau').forEach(p=>p.classList.toggle('actif',p.id==='p-'+b.dataset.p));
  });
  const play=document.getElementById('play');
  if(play) play.addEventListener('click',()=>{
    document.getElementById('vbox').innerHTML =
      `<iframe src="https://www.youtube-nocookie.com/embed/${j.video}?autoplay=1&rel=0&playsinline=1" title="${esc(j.nom)} - règles en vidéo" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  });
  window.scrollTo(0,0);
}

function router(){
  if(!document.querySelector('.fiche')) scrollListe = window.scrollY;
  const id = decodeURIComponent(location.hash.slice(1));
  const j = JEUX.find(x=>x.id===id);
  if(j) vueJeu(j); else vueListe();
}
window.addEventListener('hashchange',router);
router();
</script>
</body>
</html>
